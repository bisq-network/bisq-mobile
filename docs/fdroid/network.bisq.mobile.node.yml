AutoName: Bisq Easy

RepoType: git
Repo: https://github.com/bisq-network/bisq-mobile.git

# Reproducible builds: F-Droid publishes the APKs signed by the Bisq release key once its own
# build of the tag matches them.
AllowedAPKSigningKeys: 20425c3acefd9aa7039f708e2cb36edf9043e7187d7066f706608a8a431f3841

# One build per ABI. Every build runs the same invocation as the release build: a plain
# assembleRelease, which writes the universal APK and the four splits. Do not pass -Pabi:
# AGP's manifest merger formats the first output it writes differently, and without the
# universal APK that is armeabi-v7a, whose bytes then no longer match the published APK.
# The version code of a split is node.android.version.code * 1000 + the index of its ABI.
Builds:
  - versionName: 1.0.0
    versionCode: 57001
    commit: anode_1.0.0
    subdir: apps/nodeApp
    sudo:
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-java-alternatives -a
    output: build/outputs/apk/release/Bisq_Easy-*-armeabi-v7a-*.apk
    binary: https://github.com/bisq-network/bisq-mobile/releases/download/anode_%v/Bisq_Easy-%v-armeabi-v7a-%c.apk
    gradle:
      - yes
    gradleprops:
      - allowUnsignedRelease=true
    ndk: 26.1.10909125

  - versionName: 1.0.0
    versionCode: 57002
    commit: anode_1.0.0
    subdir: apps/nodeApp
    sudo:
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-java-alternatives -a
    output: build/outputs/apk/release/Bisq_Easy-*-arm64-v8a-*.apk
    binary: https://github.com/bisq-network/bisq-mobile/releases/download/anode_%v/Bisq_Easy-%v-arm64-v8a-%c.apk
    gradle:
      - yes
    gradleprops:
      - allowUnsignedRelease=true
    ndk: 26.1.10909125

  - versionName: 1.0.0
    versionCode: 57003
    commit: anode_1.0.0
    subdir: apps/nodeApp
    sudo:
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-java-alternatives -a
    output: build/outputs/apk/release/Bisq_Easy-*-x86-*.apk
    binary: https://github.com/bisq-network/bisq-mobile/releases/download/anode_%v/Bisq_Easy-%v-x86-%c.apk
    gradle:
      - yes
    gradleprops:
      - allowUnsignedRelease=true
    ndk: 26.1.10909125

  - versionName: 1.0.0
    versionCode: 57004
    commit: anode_1.0.0
    subdir: apps/nodeApp
    sudo:
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-java-alternatives -a
    output: build/outputs/apk/release/Bisq_Easy-*-x86_64-*.apk
    binary: https://github.com/bisq-network/bisq-mobile/releases/download/anode_%v/Bisq_Easy-%v-x86_64-%c.apk
    gradle:
      - yes
    gradleprops:
      - allowUnsignedRelease=true
    ndk: 26.1.10909125

AutoUpdateMode: Version
UpdateCheckMode: Tags ^anode_
VercodeOperation:
  - '%c * 1000 + 1'
  - '%c * 1000 + 2'
  - '%c * 1000 + 3'
  - '%c * 1000 + 4'
UpdateCheckData: gradle.properties|node\.android\.version\.code=(\d+)|gradle.properties|node\.android\.version=(.+)
