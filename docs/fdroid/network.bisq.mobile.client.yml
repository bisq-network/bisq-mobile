    output: build/outputs/apk/fdroid/release/Bisq_Connect-*-x86-*-fdroid.apk
    binary: https://github.com/bisq-network/bisq-mobile/releases/download/connect_%v/Bisq_Connect-%v-x86-%c-fdroid.apk
    gradle:
      - fdroid
    gradleprops:
      - allowUnsignedRelease=true
      - abi=armeabi-v7a,arm64-v8a,x86,x86_64

